
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Copa 2026</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>⚽ Bolão Copa 2026</h1>
    <p>Bolão oficial da empresa</p>

    <input type="text" id="matricula" placeholder="Matrícula">
    <input type="password" id="senha" placeholder="Senha">

    <button onclick="login()">Entrar</button>
  </div>
</div>

<div class="app hidden" id="app">

<header>
  <div>
    <h2>🏆 Copa do Mundo 2026</h2>
    <span id="welcome"></span>
  </div>
</header>

<section class="summary">
  <div class="summary-card">
    <span>Pontos</span>
    <strong>12</strong>
  </div>

  <div class="summary-card">
    <span>Ranking</span>
    <strong>#4</strong>
  </div>

  <div class="summary-card">
    <span>Progresso</span>
    <strong id="progressText">0%</strong>
  </div>
</section>

<div id="screen-groups" class="screen">
  <h3 class="section-title">⚽ Fase de Grupos</h3>
  <div class="groups-grid" id="groupsGrid"></div>
</div>

<div id="screen-bets" class="screen hidden">
  <h3 class="section-title">📋 Minhas Apostas</h3>
  <div id="betsContainer"></div>
</div>

<div id="screen-ranking" class="screen hidden">
  <h3 class="section-title">🏆 Ranking</h3>

  <div class="ranking-item gold">
    <span>🥇 João Silva</span>
    <strong>22 pts</strong>
  </div>

  <div class="ranking-item silver">
    <span>🥈 Maria Souza</span>
    <strong>19 pts</strong>
  </div>

  <div class="ranking-item bronze">
    <span>🥉 Carlos Lima</span>
    <strong>18 pts</strong>
  </div>

  <div class="ranking-item">
    <span>4º Você</span>
    <strong>12 pts</strong>
  </div>
</div>

<nav class="bottom-nav">
  <button onclick="changeScreen('groups')">⚽<span>Grupos</span></button>
  <button onclick="changeScreen('bets')">📋<span>Apostas</span></button>
  <button onclick="changeScreen('ranking')">🏆<span>Ranking</span></button>
</nav>

</div>

<div class="modal hidden" id="modal">
  <div class="modal-content">

    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button onclick="closeModal()">✕</button>
    </div>

    <div id="gamesList"></div>

    <button class="save-btn" onclick="saveGroup()">
      Salvar Apostas
    </button>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
